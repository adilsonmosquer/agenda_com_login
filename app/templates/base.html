<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Agenda Operacional</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"> Agenda Operacional </span>
      </div>
    </nav>

    <!-- Conteúdo principal -->
    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Menu lateral -->
        <div class="col-md-3">
          <div class="list-group shadow-sm">
            <a
              href="/"
              class="list-group-item list-group-item-action {% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}"
            >
              📊 Dashboard
            </a>

            <a href="#" class="list-group-item list-group-item-action">
              📅 Agenda
            </a>

            <a href="#" class="list-group-item list-group-item-action">
              🗓 Calendário
            </a>

            <a href="#" class="list-group-item list-group-item-action">
              🔔 Alertas
            </a>

            <a href="#" class="list-group-item list-group-item-action">
              📈 Relatórios
            </a>

            <a
              href="/importacoes"
              class="list-group-item list-group-item-action {% if request.endpoint == 'importacoes.importacoes' %}active{% endif %}"
            >
              📥 Importações
            </a>

            <a href="#" class="list-group-item list-group-item-action">
              ⚙ Configurações
            </a>
          </div>
        </div>

        <!-- Área de conteúdo -->
        <div class="col-md-9">{% block content %} {% endblock %}</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

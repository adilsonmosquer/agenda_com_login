<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}Agenda Operacional{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"> Agenda Operacional </span>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Menu lateral -->
        <div class="col-md-3">
          <div class="list-group shadow-sm">
            <a
              href="{{ url_for('dashboard.dashboard') }}"
              class="list-group-item list-group-item-action {% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}"
            >
              Dashboard
            </a>

            <a
              href="{{ url_for('agenda.agenda') }}"
              class="list-group-item list-group-item-action {% if request.endpoint == 'agenda.agenda' %}active{% endif %}"
            >
              Agenda
            </a>

            <a
              href="{{ url_for('importacoes.importacoes') }}"
              class="list-group-item list-group-item-action {% if request.endpoint == 'importacoes.importacoes' %}active{% endif %}"
            >
              Importações
            </a>

            <a href="#" class="list-group-item list-group-item-action disabled">
              Alertas
            </a>

            <a href="#" class="list-group-item list-group-item-action disabled">
              Relatórios
            </a>

            <a href="#" class="list-group-item list-group-item-action disabled">
              Configurações
            </a>
          </div>
        </div>

        <!-- Conteúdo -->
        <div class="col-md-9">{% block content %}{% endblock %}</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

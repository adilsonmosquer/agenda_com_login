<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda CPEx - Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h4>Agenda CPEx</h4>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for categoria, mensagem in messages %}
                            <div class="alert alert-{{ categoria }}">
                                {{ mensagem }}
                            </div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">

                        <div class="mb-3">

                            <label>Usuário</label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Senha</label>

                            <input
                                type="password"
                                name="senha"
                                class="form-control"
                                required>

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            Entrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

{% extends "base.html" %}

{% block title %}
Alterar Senha
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h4>🔑 Alterar senha</h4>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Senha atual

                </label>

                <input
                    type="password"
                    name="senha_atual"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Nova senha

                </label>

                <input
                    type="password"
                    name="nova_senha"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Confirmar nova senha

                </label>

                <input
                    type="password"
                    name="confirmar"
                    class="form-control"
                    required>

            </div>

            <button
                class="btn btn-primary">

                Salvar

            </button>

            <a
                href="{{ url_for('dashboard.dashboard') }}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
